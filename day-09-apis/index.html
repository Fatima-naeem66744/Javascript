<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live User Fetcher</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Live User Fetcher</h1>

        <div class="search-box">
            <input 
                type="number" 
                id="userId" 
                placeholder="Enter User ID"
                min="1"
                max="10"
            >

            <button id="fetchBtn">Fetch User</button>
            <button id="postBtn">Create Demo User</button>
            <button id="errorBtn">Test Error</button>
        </div>

        <p id="loading" class="loading hidden">
            Loading...
        </p>

        <p id="error" class="error hidden"></p>

        <div id="userResult" class="user-result"></div>

    </div>

    <script src="script.js"></script>
</body>
</html>
