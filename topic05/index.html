<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>

    <style>
        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input,
        select {
            padding: 10px;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .expense-item {
            margin-bottom: 10px;
            border: 1px solid #ccc;
            padding: 10px;
        }

        h2 {
            text-align: center;
            margin-top: 20px;
        }

        #total {
            font-weight: bold;
        }

        #expenseList {
            margin-top: 20px;
        }

        #clearExpenses {
            margin-top: 20px;
        }

        select option {
            font-size: 16px;
        }

        .delete-btn {
            background-color: #dc3545;
        }

        .delete-btn:hover {
            background-color: #a71d2a;
        }
    </style>
</head>

<body>

    <h1>Expense Tracker</h1>

    <!-- Expense Form -->
    <form id="expenseForm">

        <input
            type="number"
            id="amount"
            placeholder="Amount"
            step="0.01"
            required
        >

        <input
            type="text"
            id="description"
            placeholder="Description"
            required
        >

        <select id="category" required>
            <option value="">Select Category</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Shopping">Shopping</option>
            <option value="Bills">Bills</option>
            <option value="Other">Other</option>
        </select>

        <button type="submit">Add Expense</button>

        <button type="button" id="clearExpenses">
            Clear All Expenses
        </button>

    </form>


    <!-- Expense List -->
    <div id="expenseList">
        <!-- Expenses will be added here using JavaScript -->
    </div>


    <!-- Running Total -->
    <h2>
        Total: $<span id="total">0.00</span>
    </h2>


    <script>

        // Select elements
        const expenseForm = document.querySelector('#expenseForm');
        const expenseList = document.querySelector('#expenseList');
        const totalElement = document.querySelector('#total');
        const clearExpensesButton = document.querySelector('#clearExpenses');

        // Array to store expenses
        let expenses = [];


        // -------------------------------
        // ADD EXPENSE
        // -------------------------------

        expenseForm.addEventListener('submit', function (e) {

            // Prevent page reload
            e.preventDefault();

            // Get input values
            const amount = parseFloat(
                document.querySelector('#amount').value
            );

            const description = document
                .querySelector('#description')
                .value
                .trim();

            const category = document
                .querySelector('#category')
                .value;


            // Basic validation
            if (
                isNaN(amount) ||
                amount <= 0 ||
                !description ||
                !category
            ) {
                alert(
                    'Please enter a valid amount, description, and category.'
                );

                return;
            }


            // Create expense object
            const expense = {
                id: Date.now(),
                amount: amount,
                description: description,
                category: category
            };


            // Add expense to array
            expenses.push(expense);


            // Create DOM element
            const expenseItem = document.createElement('div');

            expenseItem.classList.add('expense-item');

            // Store expense ID in DOM
            expenseItem.dataset.id = expense.id;


            // Add expense information
            expenseItem.innerHTML = `
                <h3>${expense.description}</h3>

                <p>Category: ${expense.category}</p>

                <p>Amount: $${expense.amount.toFixed(2)}</p>

                <button
                    type="button"
                    class="delete-btn"
                >
                    Delete
                </button>
            `;


            // Add expense to page
            expenseList.appendChild(expenseItem);


            // Update total
            updateTotal();


            // Clear form
            expenseForm.reset();

        });


        // -------------------------------
        // DELETE EXPENSE
        // -------------------------------

        expenseList.addEventListener('click', function (e) {

            // Check if Delete button was clicked
            if (e.target.classList.contains('delete-btn')) {

                // Find the expense DOM element
                const expenseItem = e.target.closest('.expense-item');

                // Get its ID
                const id = Number(expenseItem.dataset.id);


                // Remove expense from array
                expenses = expenses.filter(function (expense) {
                    return expense.id !== id;
                });


                // Remove expense from DOM
                expenseItem.remove();


                // Update total
                updateTotal();

            }

        });


        // -------------------------------
        // UPDATE TOTAL
        // -------------------------------

        function updateTotal() {

            let total = 0;

            expenses.forEach(function (expense) {
                total += expense.amount;
            });

            totalElement.textContent = total.toFixed(2);

        }


        // -------------------------------
        // CLEAR ALL EXPENSES
        // -------------------------------

        clearExpensesButton.addEventListener('click', function () {

            // Clear JavaScript array
            expenses = [];

            // Clear DOM
            expenseList.innerHTML = '';

            // Reset total
            totalElement.textContent = '0.00';

        });

    </script>

</body>
</html>
